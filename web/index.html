<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="RAA is Gottfried & Somberg Wealth Management's question-first research analyst workspace.">
  <meta name="theme-color" content="#f7f9f9">
  <title>RAA — Research Analyst Agent</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f7f9f9;
      --surface: #ffffff;
      --ink: #233238;
      --muted: #64747a;
      --line: #dce3e4;
      --teal: #20545b;
      --teal-hover: #173f45;
      --focus: #e5edef;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-size: 1rem;
      -webkit-font-smoothing: antialiased;
    }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    button, a { -webkit-tap-highlight-color: transparent; }
    ::selection { background: #d9e8e9; color: var(--ink); }
    :focus-visible { outline: 2px solid var(--teal); outline-offset: 4px; }
    [hidden] { display: none !important; }

    .skip-link {
      position: absolute;
      top: -5rem;
      left: 1.5rem;
      z-index: 2;
      padding: .75rem 1rem;
      background: var(--surface);
      color: var(--teal);
    }
    .skip-link:focus { top: 1rem; }
    .shell { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1.5rem 2rem;
      width: 100%;
      padding: 1.625rem clamp(1.25rem, 4vw, 3.5rem);
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .brand { display: inline-flex; align-items: center; gap: 1.25rem; }
    .wordmark {
      color: var(--teal);
      font-size: 1.375rem;
      font-weight: 650;
      letter-spacing: .08em;
      line-height: 1;
    }
    .brand-name {
      padding-left: 1.25rem;
      border-left: 1px solid var(--line);
      color: var(--muted);
      font-size: .875rem;
      line-height: 1.4;
    }
    .firm { color: var(--muted); font-size: .875rem; line-height: 1.5; text-align: right; }
    .firm span { display: block; font-size: .75rem; }

    main {
      display: flex;
      align-items: center;
      flex: 1;
      width: 100%;
      padding: 4.5rem 1.25rem 6rem;
    }
    .desk { width: 100%; max-width: 48rem; margin-inline: auto; }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 3.5vw, 2.75rem);
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: -.035em;
      text-wrap: balance;
    }
    .intro { margin: .875rem 0 2rem; color: var(--muted); line-height: 1.6; }
    .composer {
      overflow: hidden;
      border: 1px solid #cfdadb;
      border-radius: .5rem;
      background: var(--surface);
      box-shadow: 0 2px 8px rgba(26, 52, 58, .025);
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .composer:focus-within {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px var(--focus);
    }
    .query {
      display: block;
      width: 100%;
      min-height: 11rem;
      padding: 1.5rem 1.625rem 1rem;
      resize: vertical;
      border: 0;
      border-radius: 0;
      outline: none;
      background: transparent;
      color: var(--ink);
      font-size: 1.0625rem;
      line-height: 1.7;
    }
    .query::placeholder { color: var(--muted); opacity: 1; }
    .composer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      padding: .75rem 1.125rem 1.125rem 1.625rem;
    }
    .preview-note { color: var(--muted); font-size: .8125rem; line-height: 1.5; }
    .start-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.875rem;
      padding: .75rem 1.25rem;
      border: 1px solid var(--teal);
      border-radius: .25rem;
      background: var(--teal);
      color: #fff;
      font-size: .875rem;
      font-weight: 600;
      line-height: 1.4;
      transition: background .15s ease;
    }
    .start-btn:hover { background: var(--teal-hover); border-color: var(--teal-hover); }
    .examples {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: .25rem 1.125rem;
      margin-top: .75rem;
    }
    .examples-label { color: var(--muted); font-size: .8125rem; }
    .example {
      min-height: 2.75rem;
      padding: .5rem 0;
      border: 0;
      background: transparent;
      color: #506970;
      font-size: .875rem;
      line-height: 1.5;
      text-align: left;
      text-decoration-color: #9bb3b7;
      text-underline-offset: .25rem;
    }
    .example:hover { color: var(--teal); text-decoration: underline; }
    .notice {
      margin: 1rem 0 0;
      padding: .875rem 1rem;
      border-left: 2px solid var(--teal);
      background: #edf3f4;
      color: #3f5b62;
      font-size: .875rem;
      line-height: 1.6;
    }
    .footer {
      padding: 1.25rem clamp(1.25rem, 4vw, 3.5rem);
      color: var(--muted);
      font-size: .75rem;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .topbar { padding-block: 1.25rem; gap: 1rem; }
      .brand { gap: 1rem; }
      .brand-name { padding-left: 1rem; }
      .firm { text-align: left; }
      main { padding-block: 3.5rem 4rem; }
      .query { min-height: 10rem; padding: 1.25rem 1.125rem; }
      .composer-actions { padding: .5rem 1.125rem 1.125rem; }
      .examples { column-gap: 1rem; }
    }
    @media (max-width: 380px) {
      .composer-actions { align-items: stretch; flex-direction: column; gap: .75rem; }
      .start-btn { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#research">Skip to research</a>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#research" aria-label="RAA home">
        <span class="wordmark">RAA</span>
        <span class="brand-name">Research Analyst Agent</span>
      </a>
      <div class="firm">Gottfried &amp; Somberg<span>Wealth Management</span></div>
    </header>

    <main id="research" tabindex="-1">
      <section class="desk" aria-labelledby="question-heading">
        <h1 id="question-heading">What do you need to know?</h1>
        <p class="intro">Start with a focused investment question.</p>
        <div class="composer">
          <textarea id="question" class="query" aria-label="Research question" aria-describedby="preview-note" placeholder="Ask about a company, sector, or market…"></textarea>
          <div class="composer-actions">
            <span id="preview-note" class="preview-note">Live research coming soon</span>
            <button id="start" class="start-btn" type="button">Begin research</button>
          </div>
        </div>
        <div class="examples" aria-label="Example questions">
          <span class="examples-label">Try</span>
          <button class="example" type="button" data-prompt="Is AXON attractive after this pullback?">Equity outlook</button>
          <button class="example" type="button" data-prompt="What is the strongest risk to the current semiconductor cycle?">Sector risk</button>
          <button class="example" type="button" data-prompt="How would lower rates change the small-cap outlook?">Macro scenario</button>
        </div>
        <p class="notice" id="notice" role="status" aria-live="polite" aria-atomic="true" hidden></p>
      </section>
    </main>

    <footer class="footer">For internal use</footer>
  </div>

  <script>
    const question = document.getElementById('question');
    const notice = document.getElementById('notice');

    function clearNotice() {
      notice.hidden = true;
      notice.textContent = '';
    }

    document.querySelectorAll('[data-prompt]').forEach((button) => {
      button.addEventListener('click', () => {
        question.value = button.dataset.prompt;
        clearNotice();
        question.focus();
      });
    });

    question.addEventListener('input', clearNotice);

    document.getElementById('start').addEventListener('click', () => {
      notice.hidden = false;
      if (!question.value.trim()) {
        notice.textContent = 'Enter a research question to try the workspace.';
        question.focus();
        return;
      }
      notice.textContent = 'Live research is not available yet. Your question has not been submitted.';
    });
  </script>
</body>
</html>
