[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "raa-research-analyst-agent"
version = "0.1.0"
description = "Evidence-first research analyst agent for answering specific investment questions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7"]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
raa = "raa.cli:main"
raa-desktop = "raa.ui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/raa"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

